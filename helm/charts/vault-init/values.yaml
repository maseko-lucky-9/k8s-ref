# Namespace where the prod-mode Vault is running.
vaultNamespace: vault-k8s-ref-demo

# Service name for the Vault pod (matches the ArgoCD Application name +
# Helm release name of the upstream hashicorp/vault chart).
vaultServiceName: vault-k8s-ref-demo

# Secret to write the unseal key + root token into (created if missing).
# Anyone with `get secret` on this name in this namespace can fully control
# Vault — RBAC accordingly. ADR-0005 acknowledges the trade-off.
keysSecret: vault-init-keys

# Shamir scheme. 1-of-1 is the single-operator homelab default; bump for
# multi-operator scenarios.
shamir:
  shares: 1
  threshold: 1

image:
  repository: hashicorp/vault
  tag: "1.19.0"
  pullPolicy: IfNotPresent

# Always-on unseal watcher (INTERIM WORKAROUND — see deployment-unsealer.yaml /
# plan A4). Re-unseals the Shamir-sealed Vault after ANY pod restart, decoupled
# from ArgoCD sync. The init Job (above) still handles first-install init+unseal;
# this watcher only unseals an already-initialised, sealed Vault.
unsealer:
  enabled: true
  # How often to poll `vault status`. 15s ⇒ worst-case ~15s sealed window.
  intervalSeconds: 15
  # Guaranteed QoS (requests == limits) so the watcher is not first-evicted under
  # node pressure — the failure mode it exists to recover from.
  # NOTE: idle RSS is ~5Mi, but each `vault` CLI invocation (Go runtime) spikes
  # well past 32Mi — verified OOMKilled at 32Mi. 128Mi gives ~3x headroom so an
  # OOM never kills the watcher mid-unseal. CPU is compressible; 50m keeps the
  # status/unseal calls (and the heartbeat cadence) snappy.
  resources:
    cpu: 50m
    memory: 128Mi
  # Optional: a non-zero PriorityClass to further protect the watcher from
  # preemption/eviction (leave empty to use the namespace default).
  priorityClassName: ""
