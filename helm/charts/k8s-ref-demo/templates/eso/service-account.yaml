{{- if .Values.eso.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.eso.serviceAccountName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "k8s-ref-demo.labels" . | nindent 4 }}
{{- end }}
{{/*
  REMOVED 2026-08-25 — ClusterRole + ClusterRoleBinding `k8s-ref-demo-eso-reader`.

  The ClusterRole granted CLUSTER-WIDE `secrets: [get, list, watch]` with no namespace
  scope. In this estate that would have included `vault/vault-unseal-keys`, which holds
  key1/key2/key3 against a 3-key unseal threshold PLUS the root token — i.e. full unseal
  and root in one object. Never deployed here (no `k8s-ref-demo` namespace, no matching
  ClusterRole/Binding, no ArgoCD Application), so this was latent, not active.

  If a future chart revision genuinely needs ESO to read secrets, use a namespaced Role +
  RoleBinding scoped to `.Values.namespace`, not a ClusterRole. ESO does not require
  cluster-wide secret read to function.
*/}}
